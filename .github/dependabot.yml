version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # PR titles become "ci(deps): bump ...", a Conventional Commit subject.
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # PR titles become "chore(deps): bump ...", a Conventional Commit subject.
      prefix: chore
      include: scope
    groups:
      npm:
        patterns: ['*']
