name: Bug
description: Report something that does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of steps that shows the problem.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include error messages or logs (as text, not screenshots).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release, commit or environment where this happens.
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Checkable outcomes that mean this bug is fixed, including a regression test.
      value: |
        - [ ] 
    validations:
      required: true
